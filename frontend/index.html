<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Dynamic Analyzer</title>

</head>

<body>

  <header>
    <h1>🛡️ Mini Dynamic Analyzer</h1>
    <nav>
      <a href="#">Historia</a>
      <a href="#">Ustawienia</a>
      <a href="#">API Documentation</a>
    </nav>
  </header>

  <main>
    <!-- Panel Uploadu -->
    <div class="upload-card" id="upload-container">
      <div class="upload-icon">📁</div>

      <h3>Przeciągnij i upuść plik .exe tutaj</h3>

      <p style="color: var(--text-muted); margin-top: 5px;">lub kliknij, aby wybrać z komputera</p>

      <input type="file" id="file-input" style="display: none;" accept=".exe">
      <br>
      <div class="upload-actions">
        <button type="button" class="btn-submit" id="show-btn"
          onclick="document.getElementById('file-input').click()">Wybierz plik</button>

        <button type="button" class="btn-submit" id="start-analysis-btn" hidden>Rozpocznij analizę</button>
      </div>
    </div>


    <!-- Pasek Postępu Analizy -->
    <div class="status-card">
      <div class="status-header">
        <span id="analysis-status">Status: ⚪ Oczekiwanie na analizę</span>
        <span id="analysis-progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="analysis-progress-bar" style="width: 0%;"></div>
      </div>
    </div>


    <!-- Zakładki -->
    <div class="tabs">
      <button class="tab-btn active" data-filter="all">
        Wszystkie akcje (<span id="count-all">0</span>)
      </button>
      <button class="tab-btn" data-filter="Plik">
        Pliki (<span id="count-files">0</span>)
      </button>
      <button class="tab-btn" data-filter="Proces">
        Procesy (<span id="count-processes">0</span>)
      </button>
      <button class="tab-btn" data-filter="Sieć">
        Sieć (<span id="count-network">0</span>)
      </button>
    </div>


    <!-- Tabela z Wynikami na Żywo -->
    <div class="results-card">
      <table>
        <thead>
          <tr>
            <th>Czas</th>
            <th>Zdarzenie</th>
            <th>Kategoria</th>
          </tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
